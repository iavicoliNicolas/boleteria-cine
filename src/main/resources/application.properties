spring.application.name=platea

server.port=${PORT:8741}
server.address=0.0.0.0
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

spring.datasource.url=jdbc:h2:mem:platea;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Buenos_Aires
spring.jpa.properties.hibernate.jdbc.batch_size=40
spring.jpa.properties.hibernate.order_inserts=true

spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

logging.level.org.hibernate=warn
logging.level.org.springframework.web=info
